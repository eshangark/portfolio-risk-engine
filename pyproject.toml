[build-system]
requires = ["scikit-build-core>=0.10,<1", "pybind11>=2.13,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "portfolio-risk-engine"
version = "0.2.0"
description = "C++ portfolio risk, automatic differentiation, and constrained allocation with independent Python validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["scipy>=1.11", "osqp>=1.0,<2", "scikit-learn>=1.4", "requests>=2.31,<3", "pandas>=2.1,<3", "exchange-calendars>=4.5,<5"]
app = ["streamlit>=1.40,<2", "pandas>=2.1,<3", "scikit-learn>=1.4", "requests>=2.31,<3", "exchange-calendars>=4.5,<5"]

[tool.scikit-build]
wheel.packages = ["src/portfolio_risk"]
cmake.build-type = "Release"
cmake.define.BUILD_TESTING = "OFF"
sdist.exclude = ["docs/paper/*.pdf", "work", "build"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-engine"
version = "0.1.0"
description = "Mathematical reference for portfolio risk, sensitivity, and constrained allocation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
include = ["portfolio_risk*"]

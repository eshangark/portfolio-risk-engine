name: Engine validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - run: python -m pip install '.[test,app]'
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.two_asset --output work/two-asset.json
      - run: python -m examples.engine_report --output work/engine-report.json
      - run: python -m examples.research_report --output work/research-report.json
      - run: python -m examples.backtest_report --output work/backtest-report.json
      - run: python -m examples.benchmark --output work/benchmark.json
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: numerical-evidence-${{ matrix.python }}
          path: work/*.json
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - run: cmake -S . -B build/native -DPORTFOLIO_BUILD_PYTHON=OFF -DPORTFOLIO_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/native -j2
      - run: ctest --test-dir build/native --output-on-failure
